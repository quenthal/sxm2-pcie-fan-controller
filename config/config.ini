[serial]
# "auto" probes serial devices for the firmware HELLO response. For permanent
# installation prefer a stable /dev/serial/by-id/... path.
port = auto
baud = 115200
# PySerial read/write timeout for individual I/O operations.
timeout_seconds = 0.25
# How long one command waits for a valid reply, and how many same-session
# retries are attempted before the daemon closes/reopens the port.
command_reply_timeout_seconds = 1.2
command_retries = 2
reconnect_seconds = 2.0

[gpu]
# NVIDIA index (0), full GPU UUID (GPU-...), or a unique substring of the name.
selector = V100
poll_seconds = 8.0
# Keep this comfortably below controller watchdog_timeout_seconds.
nvidia_smi_timeout_seconds = 2.0
# Low-pass time constant; 0 disables filtering. With rise bypass enabled,
# temperature increases pass immediately while cooling is smoothed.
temperature_smoothing_seconds = 5.0
temperature_rise_bypass = true

[fan]
# Piecewise-linear temperature_C:fan_percent curve.
curve = 30:10,55:10,60:15,65:25,70:40,75:60,80:100
# Firmware accepts 0..100 for calibration. This is a safety floor, but it cannot
# lower a curve whose own lowest point is higher.
minimum_percent = 10
failure_percent = 100
# Safety requests bypass these normal-response dynamics. 0 rate = immediate.
rise_rate_percent_per_second = 100
fall_hold_seconds = 16
fall_rate_percent_per_second = 0.5
# Suppress small PWM target changes to reduce audible RPM/pitch wandering.
# Small upward changes bypass the deadband on rapid heating or at high temp.
target_deadband_percent = 3
deadband_rapid_rise_c = 2
deadband_bypass_temperature_c = 70

[controller]
# Pushed to ESP protocol v3 after every serial reconnect; no reflash required.
watchdog_timeout_seconds = 30.0
stall_timeout_seconds = 3.0
stall_recovery_seconds = 5.0
rpm_sample_seconds = 1.0
# Standard PC 4-wire fans normally use 2 TACH pulses/revolution.
tach_pulses_per_rev = 2

[safety]
# New stalls with a live GPU before daemon locks to failure_percent until restart.
# 0 disables daemon-side persistent lock; ESP stall recovery remains active.
stall_lock_events = 2
# 0 disables this host-side threshold. At/above this raw GPU temperature the
# daemon immediately requests failure_percent and logs CRITICAL.
critical_temperature_c = 80

[logging]
level = INFO
